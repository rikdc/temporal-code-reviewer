services:
  postgresql:
    image: postgres:15-alpine
    container_name: temporal-reviewer-postgres
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to host — only accessible from other containers.

  temporal:
    image: temporalio/auto-setup:1.29.3
    container_name: temporal-reviewer-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - SKIP_DYNAMIC_CONFIG_UPDATE=true
    # Not published to host — only accessible from other containers.
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.53.2
    container_name: temporal-reviewer-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8081
    ports:
      - "127.0.0.1:8080:8080"

  init-temporal:
    image: temporalio/tctl:1.18
    container_name: temporal-reviewer-init
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init-temporal.sh"]
    volumes:
      - ./scripts/init-temporal.sh:/scripts/init-temporal.sh:ro

  lyon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temporal-reviewer-service
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    volumes:
      - reviewer-data:/root/.config/temporal-reviewer
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8081:8081"  # Dashboard
      - "127.0.0.1:8082:8082"  # Webhook/API
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  reviewer-data:
