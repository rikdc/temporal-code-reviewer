openrouter:
  api_key: ""  # Set via OPENROUTER_API_KEY env var or api_key_file
  base_url: "https://openrouter.ai/api/v1"
  timeout: 120

auto_fix_users: []
# auto_fix_users:
#   - your-github-login

temporal:
  namespace: "code-reviewer"
  dashboard_base_url: ""

server:
  bind_address: "127.0.0.1:8082"
  dashboard_address: "127.0.0.1:8081"
  read_timeout: 30
  write_timeout: 60
  idle_timeout: 120
  max_header_bytes: 1048576  # 1MB
  max_body_bytes: 2097152    # 2MB

webhook:
  enabled: false
  secret: ""       # Set via WEBHOOK_SECRET env var or secret_file
  allowed_repos: []
  # allowed_repos:
  #   - owner/repo-name
  max_body_bytes: 2097152  # 2MB
  allowed_actions:
    - opened
    - synchronize
    - reopened

admin:
  token: ""       # Set via ADMIN_API_TOKEN env var or token_file

poller:
  enabled: false
  interval_seconds: 7200  # 2 hours (was 15 minutes)
  repos: []
  # repos:
  #   - owner/repo-name
  filters:
    max_age_days: 5
    skip_drafts: true
    skip_bots: true
    require_reviewer_logins: []

agents:
  security:
    model: "anthropic/claude-sonnet-4"
    max_tokens: 2000
    temperature: 0.3
    prompt_file: "security.md"

  style:
    model: "anthropic/claude-3.5-haiku"
    max_tokens: 1500
    temperature: 0.5
    prompt_file: "style.md"

  logic:
    model: "anthropic/claude-sonnet-4"
    max_tokens: 2000
    temperature: 0.3
    prompt_file: "logic.md"

  documentation:
    model: "anthropic/claude-3.5-haiku"
    max_tokens: 1500
    temperature: 0.5
    prompt_file: "documentation.md"

  triage:
    model: "anthropic/claude-sonnet-4"
    max_tokens: 8000
    temperature: 0.2
    prompt_file: "triage.md"

  fix_generator:
    model: "anthropic/claude-haiku-4-5"
    max_tokens: 2000
    temperature: 0.1
    prompt_file: ""
